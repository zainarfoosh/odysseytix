name: Odyssey seat-release monitor

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Run diagnostic (--check) instead of the normal run"
        type: boolean
        default: false
  schedule:
    - cron: "*/5 9-15 * * *"    # 5:00am–11:59am ET — every 5 min (peak release window)
    - cron: "*/20 16-21 * * *"  # 12:00pm–5:59pm ET — every 20 min
    - cron: "0 22-23 * * *"     # 6:00pm–7:59pm ET — hourly
    - cron: "0 0-8 * * *"       # 8:00pm–4:59am ET — hourly

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MENTION: ${{ vars.GH_MENTION }}
        run: |
          if [ "${{ github.event.inputs.diagnostic }}" = "true" ]; then
            python monitor.py --check
          else
            python monitor.py
          fi

      - name: Email alert
        if: ${{ env.NEW_DATES != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Odyssey showtimes just opened: ${{ env.NEW_DATES }}"
          to: "you@example.com, friend@example.com, other@example.com"
          from: Odyssey Monitor
          body: |
            New date(s) now on sale for The Odyssey (IMAX 70MM) at Regal Mall of Georgia:
            ${{ env.NEW_DATES }}

            Grab seats: https://www.fandango.com/regal-mall-of-georgia-aankx/theater-page?format=IMAX%2070MM

      - name: Persist state if changed
        run: |
          if ! git diff --quiet seen_dates.json; then
            git config user.name  "odyssey-monitor"
            git config user.email "actions@github.com"
            git add seen_dates.json && git commit -m "Update seen dates" && git push
          fi
